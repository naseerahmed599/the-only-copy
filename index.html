<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b1f">
  <meta name="description" content="The Little Prince, retold for one reader. Print run: one.">
  <meta property="og:title" content="The Only Copy">
  <meta property="og:description" content="The Little Prince, retold for one reader. Print run: one.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://naseerahmed599.github.io/the-only-copy/">
  <meta property="og:image" content="https://naseerahmed599.github.io/the-only-copy/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex, nofollow">
  <title>The Only Copy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8c872'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e8c872' stroke-opacity='.5' stroke-width='1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mood="deep">

  <!-- Sky: a canvas starfield that parallaxes and twinkles; the body background tints by mood -->
  <div id="tint" aria-hidden="true">
    <div class="tint tint--day"></div>
    <div class="tint tint--dusk"></div>
    <div class="tint tint--night"></div>
    <div class="tint tint--deep"></div>
  </div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- Chapter transitions: a slow vignette dip when a new part begins -->
  <div id="vignette" aria-hidden="true"></div>

  <!-- Discreet UI -->
  <button id="sound" class="ui-btn" type="button" aria-pressed="false" aria-label="Toggle music" title="Music">♪</button>
  <audio id="bgm" loop preload="none" src="audio/theme.mp3"></audio>

  <!-- Progress: a tiny planet on a thin orbit line -->
  <nav id="progress" aria-label="Reading progress">
    <div class="track"></div>
    <button class="planet" type="button" aria-label="Current part">
      <span class="ring"></span>
      <span class="dot"></span>
    </button>
    <div class="label" role="status" aria-live="polite"></div>
  </nav>

  <!-- The story is rendered here from scenes.js (only after the optional gate is solved) -->
  <main id="story" aria-label="The Only Copy"></main>

  <!-- A quiet ending: nothing but sky -->
  <div class="quiet" aria-hidden="true"></div>

  <noscript>
    <p style="padding:2rem;text-align:center;font-family:Georgia,serif">This edition needs JavaScript to turn its pages.</p>
  </noscript>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
